    <!-- Sutil sombra para dar profundidad limpia -->
    <filter
       id="sombra"
       x="-0.01673913"
       y="-0.046666667"
       width="1.0334783"
       height="1.1054545"
       color-interpolation-filters="sRGB">
      <feGaussianBlur
         in="SourceAlpha"
         stdDeviation="6"
         result="blur"
         id="feGaussianBlur1" />
      <feOffset
         in="blur"
         dx="0"
         dy="4"
         result="offsetBlur"
         id="feOffset1" />
      <feFlood
         flood-color="#000000"
         flood-opacity="0.08"
         result="color"
         id="feFlood1" />
      <feComposite
         in="color"
         in2="offsetBlur"
         operator="in"
         result="shadow"
         id="feComposite1" />
      <feMerge
         id="feMerge2">
        <feMergeNode
           in="shadow"
           id="feMergeNode1" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode2" />
      </feMerge>
    </filter>
  </defs>
