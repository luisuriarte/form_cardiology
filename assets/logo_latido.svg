  <title
     id="title1">LATIDO — Centro de Cardiología</title>
  <desc
     id="desc1">Logotipo vectorial editable: corazón estilizado dentro de un círculo abierto, en azul profundo y verde turquesa, acompañado por el nombre LATIDO.</desc>
  <defs
     id="defs2">
    <linearGradient
       id="heartGradient"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#159EAA"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#1676A3"
         id="stop2" />
    </linearGradient>
  </defs>
  <!-- Símbolo: círculo abierto + corazón + pulso -->
  <g
     id="simbolo"
     transform="translate(64 42)">
    <path
       id="aro-exterior"
       d="M 190,28 A 172,172 0 1 1 54,309"
       fill="none"
       stroke="#1676A3"
       stroke-width="17"
       stroke-linecap="round" />
    <path
       id="corazon"
       d="M 190,285              C 170,267 92,211 92,145              C 92,105 119,78 154,78              C 179,78 196,92 210,112              C 224,92 242,78 267,78              C 302,78 328,105 328,145              C 328,211 250,267 230,285              C 218,296 202,296 190,285 Z"
       fill="none"
       stroke="url(#heartGradient)"
       stroke-width="17"
       stroke-linecap="round"
       stroke-linejoin="round" />
    <path
       id="pulso-cardiaco"
       d="M 111,184 H 160 L 183,148 L 211,221 L 239,176 L 259,184 H 309"
       fill="none"
       stroke="#159EAA"
       stroke-width="13"
       stroke-linecap="round"
       stroke-linejoin="round" />
  </g>
  <!-- Logotipo tipográfico -->
  <g
     id="texto"
     transform="translate(470 0)">
    <text
       id="nombre"
       x="0"
       y="250"
       font-family="Montserrat, Avenir Next, Arial, sans-serif"
       font-size="142"
       font-weight="700"
       letter-spacing="7"
       fill="#173B56">LATIDO</text>
    <path
       id="linea-acento"
       d="M 5,292 H 560"
       fill="none"
       stroke="#159EAA"
       stroke-width="8"
       stroke-linecap="round" />
    <text
       id="especialidad"
       x="27"
       y="350"
       font-family="Montserrat, 'Avenir Next', Arial, sans-serif"
       font-size="31px"
       font-weight="600"
       letter-spacing="3.5"
       fill="#1676a3">CENTRO DE CARDIOLOGÍA</text>
    <text
       id="slogan"
       x="11"
       y="405"
       font-family="Montserrat, 'Avenir Next', Arial, sans-serif"
       font-size="23px"
       font-weight="400"
       letter-spacing="0.6"
       fill="#526b7a">Cuidamos tu corazón, acompañamos a tu familia.</text>
  </g>
